<div class="container-fluid">
    <div class="row">
        <div class="col-sm-6">
            <highcharts-chart [Highcharts]="Highcharts" [constructorType]="chartConstructor" [options]="chartOptions"
                [callbackFunction]="chartCallback" [(update)]="updateFlag" [oneToOne]="oneToOneFlag"
                [runOutsideAngular]="runOutsideAngular"
                style="width: 100%; height: 400px; display: block;">
            </highcharts-chart>
        </div>
        <div class="col-sm-6">
            <highcharts-chart [Highcharts]="Highcharts" [constructorType]="chartConstructor" [options]="piechartOptions"
                [callbackFunction]="chartCallback" [(update)]="updateFlag" [oneToOne]="oneToOneFlag"
                [runOutsideAngular]="runOutsideAngular"
                style="width: 100%; height: 400px; display: block;">
            </highcharts-chart>
        </div>
    </div>
</div>
